<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Weight goal | CalorieHub</title>
    <style>
:root {
  font-family: Arial, Helvetica, sans-serif;
  color: #090909;
  background: #fff;
  font-synthesis: none;
  -webkit-tap-highlight-color: transparent;
}

* { box-sizing: border-box; }
body { margin: 0; }
button, input { font: inherit; }
button { cursor: pointer; }

.goal-page {
  width: 100%;
  max-width: 238px;
  min-height: 526px;
  margin-inline: auto;
  padding: 32px 8px 38px 6px;
  display: flex;
  flex-direction: column;
}

.page-header {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 42px;
  flex-shrink: 0;
  margin-bottom: 0;
}

.progress { display: flex; gap: 4.5px; }
.progress span { width: 10px; height: 10px; border-radius: 50%; background: #d9d9d9; }
.progress .active { background: #080808; }
.goal-form { flex: 1; display: flex; flex-direction: column; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend {
  padding: 0;
  width: 100%;
  margin-bottom: 24px;
  text-align: center;
  font-size: 14px;
  line-height: 18px;
  font-weight: 700;
  letter-spacing: 0;
}

.goal-options { display: grid; gap: 16px; }
.goal-option { position: relative; cursor: pointer; }
.goal-option input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.goal-option span {
  display: flex;
  align-items: center;
  min-height: 35px;
  border: 1px solid #ddd;
  border-radius: 13px;
  padding: 8px 13px;
  font-size: 12px;
  line-height: 17px;
}

.goal-option input:checked + span { background: #f0f0f0; border-color: #111; box-shadow: inset 0 0 0 1px #111; }
.goal-option input:focus-visible + span, button:focus-visible { outline: 2px solid #111; outline-offset: 4px; }
.form-footer { margin-top: auto; padding-top: 32px; }
.status { margin: 0 0 12px; text-align: center; font-size: 13px; line-height: 1.5; }
.status:empty { display: none; }
.next-button {
  width: 100%;
  min-height: 32px;
  height: 32px;
  padding: 7px 14px;
  border: 0;
  border-radius: 13px;
  background: #171717;
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  line-height: 18px;
}
.next-button:disabled { background: #e3e3e3; color: #252525; cursor: default; }
/* Keep the footer at the bottom on phone screens; retain the reference
   frame's dimensions when the page is viewed in a desktop browser. */
@media (max-width: 480px) {
  .goal-page {
    min-height: 100vh;
    min-height: 100dvh;
    padding-top: max(32px, env(safe-area-inset-top));
    padding-bottom: max(38px, env(safe-area-inset-bottom));
  }
}
@media (hover: hover) {
  .goal-option:hover span { background: #f6f6f6; }
  .next-button:not(:disabled):hover { background: #333; }
}
    </style>
  </head>
  <body>
    <main class="goal-page">
      <header class="page-header">
        <div class="progress" role="img" aria-label="Step 2 of 7">
          <span></span><span class="active"></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </header>

      <form class="goal-form">
        <fieldset>
          <legend>What’s your main goal?</legend>
          <div class="goal-options">
            <label class="goal-option">
              <input type="radio" name="goal" value="lose" required>
              <span>Lose weight</span>
            </label>
            <label class="goal-option">
              <input type="radio" name="goal" value="maintain">
              <span>Maintain weight</span>
            </label>
            <label class="goal-option">
              <input type="radio" name="goal" value="gain">
              <span>Gain weight</span>
            </label>
          </div>
        </fieldset>
        <footer class="form-footer">
          <p class="status" role="status" aria-live="polite"></p>
          <button class="next-button" type="submit" disabled>Next</button>
        </footer>
      </form>
    </main>
    <script>
const form = document.querySelector('.goal-form');
const nextButton = document.querySelector('.next-button');
const status = document.querySelector('.status');
const storageKey = 'caloriehub.weightGoal';

// Storage is optional so this page also works when browser storage is blocked.
try {
  const savedGoal = localStorage.getItem(storageKey);
  const savedOption = Array.from(form.elements.goal).find(option => option.value === savedGoal);
  if (savedOption) {
    savedOption.checked = true;
    nextButton.disabled = false;
  }
} catch { /* Keep the default, unselected state. */ }

form.addEventListener('change', () => {
  nextButton.disabled = !form.elements.goal.value;
  status.textContent = '';
});

form.addEventListener('submit', event => {
  event.preventDefault();
  if (!form.reportValidity()) return;
  const goal = form.elements.goal.value;
  let saved = false;
  try {
    localStorage.setItem(storageKey, goal);
    saved = true;
  } catch { /* The selection is still available for this session. */ }
  // The remaining onboarding screens can listen for this event to continue.
  form.dispatchEvent(new CustomEvent('goal:continue', { bubbles: true, detail: { goal } }));
  status.textContent = saved ? 'Your goal has been saved.' : 'Your goal has been selected.';
  window.location.href = 'sex-age.html';
});

    </script>
  </body>
</html>
