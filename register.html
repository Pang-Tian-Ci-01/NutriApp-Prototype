<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Create your account | CalorieHub</title>
    <style>
      :root { font-family: Arial, Helvetica, sans-serif; color: #292929; background: #fff; font-synthesis: none; -webkit-tap-highlight-color: transparent; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      button, input { font: inherit; }
      .register-page {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 420px;
        min-height: 100vh;
        min-height: 100dvh;
        margin-inline: auto;
        padding: max(59px, env(safe-area-inset-top)) 6px max(47px, env(safe-area-inset-bottom));
      }
      h1 { margin: 0 14px 3px; font-size: 20px; line-height: 24px; font-weight: 700; letter-spacing: -0.4px; }
      .description { margin: 0 14px 20px; color: #888; font-size: 11px; line-height: 16px; }
      .fields { margin-inline: 9px 12px; }
      .field { position: relative; display: block; margin-bottom: 9px; }
      .field img { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; pointer-events: none; }
      .field input {
        width: 100%;
        min-height: 34px;
        padding: 9px 10px 9px 39px;
        border: 1px solid #d4d4d4;
        border-radius: 5px;
        background: #fcfcfc;
        color: #292929;
        font-size: 11px;
        line-height: 15px;
      }
      .field input::placeholder { color: #999; opacity: 1; }
      .agreement { display: flex; align-items: center; gap: 6px; margin: 12px 9px 13px; color: #858585; font-size: 10px; line-height: 12px; cursor: pointer; }
      .agreement input { flex-shrink: 0; width: 18px; height: 18px; margin: 0; accent-color: #292929; cursor: pointer; }
      .next-button { width: 100%; min-height: 31px; padding: 7px 14px; border: 0; border-radius: 12px; background: #171717; color: #fff; font-size: 12px; line-height: 17px; font-weight: 700; cursor: pointer; }
      .next-button:disabled { background: #e3e3e3; color: #252525; cursor: default; }
      .status { margin: 12px 9px 0; font-size: 12px; line-height: 18px; color: #666; }
      .status:empty { display: none; }
      .status[data-state="error"] { color: #b42318; }
      .status[data-state="success"] { color: #18713c; }
      input[aria-invalid="true"] { border-color: #b42318; }
      .login-prompt { display: flex; justify-content: center; align-items: baseline; flex-wrap: wrap; gap: 6px; margin: auto 0 0; padding-top: 32px; color: #929292; font-size: 9px; line-height: 14px; }
      .login-link { color: #777; text-underline-offset: 1px; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
      :is(input, button, a):focus-visible { outline: 2px solid #222; outline-offset: 3px; }
      @media (hover: hover) {
        .next-button:not(:disabled):hover { background: #333; }
        .login-link:hover { color: #222; }
      }
    </style>
  </head>
  <body>
    <main class="register-page">
      <h1>Create your account</h1>
      <p class="description">Good nutrition leads to a brighter you.</p>
      <form class="register-form" novalidate>
        <div class="fields">
          <label class="field">
            <span class="sr-only">Full name</span>
            <img src="icons/person_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg" alt="">
            <input type="text" name="fullName" placeholder="Full name" autocomplete="name" required>
          </label>
          <label class="field">
            <span class="sr-only">Email address</span>
            <img src="icons/mail_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg" alt="">
            <input type="email" name="email" placeholder="Email address" autocomplete="email" autocapitalize="none" spellcheck="false" required>
          </label>
          <label class="field">
            <span class="sr-only">Password</span>
            <img src="icons/lock_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg" alt="">
            <input type="password" name="password" placeholder="Password" autocomplete="new-password" required>
          </label>
          <label class="field">
            <span class="sr-only">Confirm password</span>
            <img src="icons/lock_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg" alt="">
            <input type="password" name="confirmPassword" placeholder="Confirm password" autocomplete="new-password" required aria-describedby="registration-status">
          </label>
        </div>
        <label class="agreement"><input type="checkbox" name="agreement" required checked><span>I agree to the Term of Service and Privacy Policy</span></label>
        <button class="next-button" type="submit">Next</button>
        <p class="status" id="registration-status" role="status" aria-live="polite"></p>
      </form>
      <p class="login-prompt">Already have an account? <a class="login-link" href="login.html">Login</a></p>
    </main>
    <script>
      const form = document.querySelector('.register-form');
      const nextButton = document.querySelector('.next-button');
      const statusMessage = document.querySelector('.status');
      const { fullName, email, password, confirmPassword, agreement } = form.elements;
      const accountsKey = 'caloriehub.accounts';
      let busy = false;

      function showMessage(message, state = 'error') {
        statusMessage.textContent = message;
        statusMessage.dataset.state = state;
      }
      function showError(input, message) {
        input.setAttribute('aria-invalid', 'true');
        input.focus();
        showMessage(message);
      }
      async function hashPassword(value, salt) {
        const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(value), 'PBKDF2', false, ['deriveBits']);
        const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: new Uint8Array(salt), iterations: 100000, hash: 'SHA-256' }, key, 256);
        return Array.from(new Uint8Array(bits), byte => byte.toString(16).padStart(2, '0')).join('');
      }
      form.addEventListener('input', () => {
        for (const input of [fullName, email, password, confirmPassword, agreement]) input.removeAttribute('aria-invalid');
        showMessage('');
        if (confirmPassword.value && confirmPassword.value !== password.value) {
          confirmPassword.setAttribute('aria-invalid', 'true');
          showMessage('Passwords do not match.');
        }
      });
      form.addEventListener('submit', async event => {
        event.preventDefault();
        if (busy) return;
        email.value = email.value.trim();
        if (!fullName.value.trim()) return showError(fullName, 'Enter your full name.');
        if (!email.value || !email.validity.valid) return showError(email, 'Enter a valid email address.');
        if (!password.value) return showError(password, 'Enter a password.');
        if (!confirmPassword.value) return showError(confirmPassword, 'Confirm your password.');
        if (password.value !== confirmPassword.value) return showError(confirmPassword, 'Passwords do not match.');
        if (!agreement.checked) return showError(agreement, 'Please agree to the Terms of Service and Privacy Policy.');

        busy = true;
        nextButton.disabled = true;
        nextButton.textContent = 'Creating account…';
        try {
          const normalizedEmail = email.value.toLowerCase();
          const name = fullName.value.trim();
          const salt = Array.from(crypto.getRandomValues(new Uint8Array(16)));
          const passwordHash = await hashPassword(password.value, salt);
          // Replace the previous account only after validation and hashing succeed.
          const account = { fullName: name, email: normalizedEmail, passwordHash, salt };
          localStorage.setItem(accountsKey, JSON.stringify([account]));
          localStorage.removeItem('caloriehub.session');
          sessionStorage.removeItem('caloriehub.session');
          form.reset();
          window.location.href = 'login.html';
        } catch {
          showMessage('Could not save your account. Allow browser storage and open the app on localhost or HTTPS, then try again.');
        } finally {
          busy = false;
          nextButton.disabled = false;
          nextButton.textContent = 'Next';
        }
      });
    </script>
  </body>
</html>
