<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Login | CalorieHub</title>
    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
        color: #292929;
        background: #fff;
        font-synthesis: none;
        -webkit-tap-highlight-color: transparent;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      button, input { font: inherit; }
      .login-page {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 420px;
        min-height: 100vh;
        min-height: 100dvh;
        margin-inline: auto;
        padding: max(63px, env(safe-area-inset-top)) 17px max(47px, env(safe-area-inset-bottom));
      }
      h1 { margin: 0 3px 4px; font-size: 20px; line-height: 24px; font-weight: 700; letter-spacing: -0.3px; }
      .description { margin: 0 3px 15px; color: #888; font-size: 11px; line-height: 16px; }
      .field { position: relative; display: block; margin-bottom: 8px; }
      .field img { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; opacity: 0.5; pointer-events: none; }
      .field input {
        width: 100%;
        min-height: 35px;
        padding: 9px 10px 9px 38px;
        border: 1px solid #d4d4d4;
        border-radius: 5px;
        background: #fcfcfc;
        color: #292929;
        font-size: 11px;
        line-height: 15px;
      }
      .field input::placeholder { color: #999; opacity: 1; }
      .remember { display: flex; align-items: center; gap: 4px; width: fit-content; margin: 0 0 12px; color: #858585; font-size: 10px; line-height: 15px; cursor: pointer; }
      .remember input { width: 14px; height: 14px; margin: 0; accent-color: #686868; cursor: pointer; }
      .login-button { width: 100%; min-height: 33px; padding: 8px 12px; border: 0; border-radius: 4px; background: #171717; color: #fff; font-size: 12px; line-height: 17px; cursor: pointer; }
      .login-button:disabled { background: #e3e3e3; color: #252525; cursor: default; }
      .status { margin: 12px 3px 0; font-size: 12px; line-height: 18px; color: #666; }
      .status:empty { display: none; }
      .status[data-state="error"] { color: #b42318; }
      .status[data-state="success"] { color: #18713c; }
      input[aria-invalid="true"] { border-color: #b42318; }
      .signup-prompt { display: flex; justify-content: center; align-items: baseline; flex-wrap: wrap; gap: 7px; margin: auto 0 0; padding-top: 32px; color: #929292; font-size: 9px; line-height: 14px; }
      .signup-button { padding: 0; border: 0; background: transparent; color: #777; font-size: inherit; line-height: inherit; text-decoration: underline; text-underline-offset: 1px; cursor: pointer; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
      :is(input, button, a):focus-visible { outline: 2px solid #222; outline-offset: 3px; }
      @media (hover: hover) {
        .login-button:not(:disabled):hover { background: #333; }
        .signup-button:hover { color: #222; }
      }
    </style>
  </head>
  <body>
    <main class="login-page">
      <h1>Login to continue</h1>
      <p class="description">Good nutrition leads to a brighter you.</p>
      <form class="login-form" novalidate>
        <label class="field">
          <span class="sr-only">Email address</span>
          <img src="icons/mail_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg" alt="">
          <input type="email" name="email" placeholder="Email address" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </label>
        <label class="field">
          <span class="sr-only">Password</span>
          <img src="icons/lock_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg" alt="">
          <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
        </label>
        <label class="remember"><input type="checkbox" name="remember" checked>Remember me</label>
        <button class="login-button" type="submit">Log in</button>
        <p class="status" role="status" aria-live="polite"></p>
      </form>
      <p class="signup-prompt">Don’t have an account? <a class="signup-button" href="register.html">Sign up</a></p>
    </main>
    <script>
      const form = document.querySelector('.login-form');
      const loginButton = document.querySelector('.login-button');
      const statusMessage = document.querySelector('.status');
      const remember = form.elements.remember;
      const preferenceKey = 'caloriehub.rememberMe';
      const sessionKey = 'caloriehub.session';
      const { email, password } = form.elements;
      let busy = false;

      function showMessage(message, state = 'error') {
        statusMessage.textContent = message;
        statusMessage.dataset.state = state;
      }
      function showError(input, message) {
        input.setAttribute('aria-invalid', 'true');
        input.focus();
        showMessage(message);
      }
      async function hashPassword(value, salt) {
        const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(value), 'PBKDF2', false, ['deriveBits']);
        const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: new Uint8Array(salt), iterations: 100000, hash: 'SHA-256' }, key, 256);
        return Array.from(new Uint8Array(bits), byte => byte.toString(16).padStart(2, '0')).join('');
      }

      try {
        const preference = localStorage.getItem(preferenceKey);
        if (preference !== null) remember.checked = preference === 'true';
      } catch { /* The form remains usable without browser storage. */ }

      form.addEventListener('input', () => {
        email.removeAttribute('aria-invalid');
        password.removeAttribute('aria-invalid');
        showMessage('');
      });
      remember.addEventListener('change', () => {
        try { localStorage.setItem(preferenceKey, String(remember.checked)); }
        catch { /* Only this preference is stored, never credentials. */ }
      });
      form.addEventListener('submit', async event => {
        event.preventDefault();
        if (busy) return;
        email.value = email.value.trim();
        if (!email.value || !email.validity.valid) return showError(email, 'Enter a valid email address.');
        if (!password.value) return showError(password, 'Enter your password.');
        busy = true;
        loginButton.disabled = true;
        loginButton.textContent = 'Logging in…';
        try {
          const accounts = JSON.parse(localStorage.getItem('caloriehub.accounts') || '[]');
          if (!Array.isArray(accounts)) throw new Error('Invalid account storage');
          const account = accounts.find(item => item.email === email.value.toLowerCase());
          const passwordHash = account ? await hashPassword(password.value, account.salt) : null;
          if (!account || passwordHash !== account.passwordHash) {
            return showError(password, 'Incorrect email or password. Please try again.');
          }
          const session = JSON.stringify({ email: account.email, fullName: account.fullName, loggedInAt: new Date().toISOString() });
          localStorage.removeItem(sessionKey);
          sessionStorage.removeItem(sessionKey);
          (remember.checked ? localStorage : sessionStorage).setItem(sessionKey, session);
          localStorage.setItem(preferenceKey, String(remember.checked));
          password.value = '';
          window.location.href = 'weight-goal.html';
        } catch {
          showMessage('Could not log in. Allow browser storage and open the app on localhost or HTTPS, then try again.');
        } finally {
          busy = false;
          loginButton.disabled = false;
          loginButton.textContent = 'Log in';
        }
      });
      try {
        const session = JSON.parse(localStorage.getItem(sessionKey) || sessionStorage.getItem(sessionKey) || 'null');
        if (session && typeof session.fullName === 'string') {
          showMessage('You are logged in. Welcome, ' + session.fullName + '!', 'success');
        }
      } catch { /* A missing or invalid session does not prevent login. */ }
    </script>
  </body>
</html>
